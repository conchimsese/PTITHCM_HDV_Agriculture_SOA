spring.autoconfigure.exclude=
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/payment_db}
spring.datasource.username=${DB_USERNAME:payment_owner}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.flyway.locations=classpath:db/learning
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
payment.outbox.relay.enabled=${PAYMENT_OUTBOX_RELAY_ENABLED:false}
payment.rewards.enabled=${PAYMENT_REWARDS_ENABLED:false}
payment.rewards.poll-ms=${PAYMENT_REWARDS_POLL_MS:60000}
logging.level.org.springframework.jdbc.core=INFO

