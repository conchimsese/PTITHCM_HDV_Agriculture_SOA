chat.jwt.public-key-directory=${JWT_PUBLIC_KEY_LOCATION}
chat.jwt.issuer=${JWT_ISSUER:urn:soa:user-service}
chat.jwt.audience=${JWT_AUDIENCE:soa-api}
chat.user-service-url=${USER_SERVICE_URL}
chat.internal-service-key=${INTERNAL_SERVICE_KEY}
chat.access-state-timeout-ms=${ACCESS_STATE_TIMEOUT_MS:1000}
# Spring MVC DEBUG logs may include message bodies. Keep secure API logs at INFO.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
