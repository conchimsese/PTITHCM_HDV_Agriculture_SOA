name: Frontend standard
on:
  push:
    paths: ['PTITHCM_HDV_Agriculture_FE/frontend-standard/**', '.github/workflows/frontend-standard.yml']
  pull_request:
    paths: ['PTITHCM_HDV_Agriculture_FE/frontend-standard/**', '.github/workflows/frontend-standard.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PTITHCM_HDV_Agriculture_FE/frontend-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PTITHCM_HDV_Agriculture_FE/frontend-standard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run export:android
        env:
          CI: '1'
