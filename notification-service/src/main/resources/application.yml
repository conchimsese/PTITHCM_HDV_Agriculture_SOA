server:
  port: 8086
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: notification-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  security:
    internal-service-key: ${INTERNAL_SERVICE_KEY:notification-secret-key}
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/public.pem}
      issuer: ${JWT_ISSUER:urn:soa:user-service}
      audience: ${JWT_AUDIENCE:soa-api}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

