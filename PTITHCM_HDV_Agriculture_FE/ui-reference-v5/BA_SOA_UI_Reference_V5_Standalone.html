const status=(x,domain='default')=>`<span class="status ${clsStatus(x)}">${esc((specialLabels[domain]||{})[x]||labels[x]||x)}</span>`;
const btn=(text,target,primary=false,icoName='arrow',extra='')=>`<button class="btn ${primary?'primary':''} ${extra}" data-go="${esc(target)}">${ic(icoName,'sm')}${esc(text)}</button>`;
const head=(k,h,p)=>`<div class="head"><div class="kicker">${esc(k)}</div><h1>${esc(h)}</h1><p>${esc(p)}</p></div>`;
const infoRow=(label,value)=>`<div class="info-row"><span>${esc(label)}</span><strong>${value}</strong></div>`;
const avatar=(p,extra='')=>`<span class="avatar ${extra}">${esc(p.initial)}</span>`;
const field=(id,label,type='text',val='',required=false,opts='')=>`<div class="field"><label for="${esc(id)}">${esc(label)}</label><input id="${esc(id)}" name="${esc(id)}" type="${type}" value="${esc(val)}" ${required?'required':''} ${opts}/></div>`;
const select=(id,label,items,selected='')=>`<div class="field"><label for="${esc(id)}">${esc(label)}</label><select id="${esc(id)}" name="${esc(id)}">${items.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(selected)?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`;
const readonly=(label,value)=>`<div class="read-only"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`;
const navs={farmer:[['home','Trang chủ','home'],['plots','Ruộng lúa','field'],['listings','Bán lúa','bag'],['messages','Tin nhắn','chat'],['profile','Tài khoản','user']],trader:[['home','Tổng quan','home'],['feed','Tìm lúa','compass'],['messages','Tin nhắn','chat'],['contracts','Hợp đồng','file'],['profile','Tài khoản','user']],admin:[['home','Tổng quan','home'],['accounts','Tài khoản','users'],['disputes','Tranh chấp','shield'],['notifications','Thông báo','bell'],['profile','Tài khoản tôi','user']]};
const sideLinks={farmer:[['plots','Danh sách ruộng','field'],['journal','Nhật ký canh tác','book'],['costs','Chi phí mùa vụ','wallet'],['report','Báo cáo mùa vụ','file'],['listings','Bài đăng bán lúa','bag'],['contracts','Hợp đồng & tiền cọc','file'],['disputes','Tranh chấp','shield'],['notifications','Thông báo','bell']],trader:[['feed','Tìm lúa gần tôi','compass'],['messages','Các cuộc trao đổi','chat'],['contracts','Hợp đồng','file'],['disputes','Tranh chấp','shield'],['notifications','Thông báo','bell']],admin:[['accounts','Quản lý tài khoản','users'],['disputes','Xử lý tranh chấp','shield'],['notifications','Thông báo của tôi','bell']]};
const st={role:'farmer',page:'home',plot:'P1',season:'S1',listing:'L1',chat:'C1',chatOpen:false,searchChat:'',unreadOnly:false,listingStep:1,feedRadius:15,roleEntryFrom:'home',account:'A1',dispute:'D1',guideTab:'tokens'};
let toastTimer;
function toast(t){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3400)}
function modal(title,body,actions=''){document.getElementById('modal-root').innerHTML=`<div class="modal-shade" data-shade="1"><section class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${esc(title)}</h2><button type="button" class="modal-close" data-close="1" aria-label="Đóng">${ic('x')}</button></div><div class="modal-body">${body}</div>${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;document.querySelector('.modal-box [data-close]').focus()}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function demoNote(msg){modal('Ghi chú triển khai',`<div class="callout info">${esc(msg)}</div><p>Prototype chỉ sử dụng dữ liệu giả lập trong bộ nhớ của trang. Hành động này chưa gọi backend và không tạo giao dịch thật.</p>`,`<button class="btn primary" data-close="1">Đã hiểu</button>`)}
function navTo(page){st.page=page;st.chatOpen=false;window.scrollTo({top:0,behavior:'instant'});render()}
function goListing(id){st.listing=id;navTo('listing-detail')}
function goChat(id){st.chat=id;st.page='messages';st.chatOpen=!!id;render()}
function main(){const r=st.role;const n=navs[r];const selected=activeNav();const unread=d.notifications.filter(x=>!x.read).length;return `<header class="top"><div class="top-inner"><a class="logo" href="#" data-go="home" aria-label="Về trang chủ"><span class="logo-mark">${ic('sprout','lg')}</span><span class="logo-copy"><strong>Ruộng Lúa Việt</strong><small>Gắn mùa vụ · Nối giao thương</small></span></a><nav class="top-links" aria-label="Điều hướng chính">${n.map(([id,text,icon])=>`<button class="top-link ${selected===id?'active':''}" data-go="${id}" aria-current="${selected===id?'page':'false'}">${ic(icon)}${esc(text)}</button>`).join('')}</nav><div class="top-actions"><span class="demo-pill">Bản mẫu nội bộ</span><button class="round-btn guide-btn" title="Design system cho nhóm" data-go="guide" aria-label="Hướng dẫn thiết kế">${ic('layers')}</button><button class="round-btn" data-go="notifications" title="Thông báo" aria-label="Thông báo">${ic('bell')}${unread?`<span class="count">${unread}</span>`:''}</button><select class="role-select" id="role-switch" aria-label="Chọn vai trò bản demo"><option value="farmer" ${r==='farmer'?'selected':''}>Farmer · Nông dân</option><option value="trader" ${r==='trader'?'selected':''}>Trader · Thương lái</option><option value="admin" ${r==='admin'?'selected':''}>Admin · Quản trị</option></select></div></div></header>`}
function activeNav(){if(st.page==='listing-detail'||st.page==='listing-create')return st.role==='farmer'?'listings':'feed';if(['season','journal','costs','report','plot-create'].includes(st.page))return 'plots';if(['account-detail'].includes(st.page))return 'accounts';if(['dispute-detail'].includes(st.page))return 'disputes';return st.page}
function side(){const r=st.role,links=sideLinks[r];return `<div class="panel"><div class="panel-heading">Khu vực làm việc · ${ROLE_LABEL[r]}</div>${links.map(([id,label,icon])=>`<button class="side-item ${st.page===id||activeNav()===id?'active':''}" data-go="${id}">${ic(icon,'sm')}${esc(label)}${id==='messages'?`<span class="side-count">${d.conversations.length}</span>`:''}</button>`).join('')}<hr class="side-line"/><button class="side-item ${st.page==='guide'?'active':''}" data-go="guide">${ic('layers','sm')}UI chuẩn của nhóm</button></div>${r==='farmer'?`<div class="panel"><div class="panel-heading">Ruộng đang chọn</div><div class="row">${ic('field','lg')}<div><strong>${esc(plot(st.plot).name)}</strong><div class="fine">${esc(season(st.season).name)}</div></div></div><div style="margin-top:11px">${btn('Xem mùa vụ','season',false,'arrow','block sm')}</div></div>`:''}<div class="side-footer">BA–SOA · Contract v2.1<br/>Dữ liệu và vai trò chỉ để xem UI mẫu.</div>`}
function right(){if(st.page==='guide')return `<div class="panel"><h3>Bàn giao cho team</h3><p>Toàn bộ vai trò dùng chung CSS variables, component, trạng thái và quy ước điều hướng.</p><div class="alert-line">Đừng tự sửa riêng màu, font hoặc nhãn trạng thái khi code từng service.</div></div>`;if(st.page==='listing-detail'){const l=listing(st.listing),p=plot(l.plotId),s=season(l.seasonId);return `<div class="panel"><h3>Thông tin bài đăng</h3>${infoRow('Giống lúa',esc(s.crop))}${infoRow('Diện tích',num(p.area)+' m²')}${infoRow('Sản lượng dự kiến',num(s.yield)+' kg')}${infoRow('Trạng thái',status(l.status,'listing'))}<div class="callout warn">Báo giá được đồng ý chỉ để trao đổi. Chưa có nghĩa đã bán lúa.</div></div>`}if(st.page==='messages'){return ''}if(st.role==='farmer')return `<div class="panel"><h3>${ic('sprout','sm')} Mùa vụ đang canh tác</h3><div class="fine">${esc(plot(st.plot).name)} · ${esc(season(st.season).crop)}</div><div class="mini-figure">${num(season(st.season).yield)} <span style="font-size:12px">kg</span></div><p>Sản lượng dự kiến từ Farming, không phải số đã thu hoạch.</p><div class="side-action">${btn('Xem chi tiết mùa vụ','season',false,'arrow','sm block')}</div></div><div class="panel"><h3>Công việc liên quan</h3><ul class="mini-list"><li>${ic('book','sm')} Ghi lại hoạt động canh tác</li><li>${ic('wallet','sm')} Theo dõi chi phí mỗi vụ</li><li>${ic('bag','sm')} Bán lúa từ dữ liệu ruộng</li></ul></div>`;if(st.role==='trader')return `<div class="panel"><h3>Tìm nguồn lúa</h3><p>Feed theo khoảng cách GPS, do Trading Service cung cấp.</p>${infoRow('Bán kính demo',num(st.feedRadius)+' km')}${infoRow('Thương lượng','Qua Offer & Chat')}${infoRow('Tiền đặt cọc','Mô phỏng 5%')}<div class="callout info">Trader không nhìn thấy báo giá của Trader khác trên cùng Listing.</div></div>`;return `<div class="panel"><h3>Giới hạn quyền Admin</h3><p>Admin xử lý tài khoản và tranh chấp theo Contract; không tự động có quyền đọc Chat riêng tư.</p><div class="alert-line">Không cho phép mở khóa khi điểm uy tín vẫn bằng 0 hoặc còn nguyên nhân khóa khác.</div></div>`}
function footerNav(){return `<nav class="mobile-nav" aria-label="Điều hướng điện thoại">${navs[st.role].map(([id,label,icon])=>`<button data-go="${id}" class="${activeNav()===id?'active':''}" aria-label="${esc(label)}">${ic(icon)}<span>${esc(label)}</span></button>`).join('')}</nav>`}
function render(){const isChat=st.page==='messages'&&st.role!=='admin';document.body.classList.toggle('mobile-thread',isChat&&st.chatOpen);document.getElementById('root').innerHTML=main()+`<main class="shell ${isChat?'chat-shell':''} ${st.chatOpen?'chat-open':''}" id="shell"><aside class="side" id="left">${isChat?chatLeft():side()}</aside><section class="center" id="middle">${isChat?chatCenter():view()}</section><aside class="aside" id="right">${isChat?chatRight():right()}</aside></main>`+footerNav();document.querySelectorAll('.data-table').forEach(table=>{const heads=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());table.querySelectorAll('tbody tr').forEach(tr=>{[...tr.children].forEach((td,i)=>td.setAttribute('data-label',heads[i]||'Thao tác'))})});if(isChat){const thread=document.querySelector('.thread');if(thread)thread.scrollTop=thread.scrollHeight}}
function view(){if(st.page==='guide')return guide();if(st.page==='notifications')return notifications();if(st.page==='profile')return profile();if(st.role==='farmer')return farmerViews();if(st.role==='trader')return traderViews();return adminViews()}
/* ---------------------------- FARMER ---------------------------- */
function farmerViews(){switch(st.page){case 'home':return farmerHome();case 'plots':return plotsPage();case 'season':return seasonPage();case 'journal':return journalPage();case 'costs':return costsPage();case 'report':return reportPage();case 'listings':return farmerListings();case 'listing-detail':return listingDetail();case 'listing-create':return createListing();case 'contracts':return contractsPage();case 'disputes':return disputesPage();case 'dispute-detail':return disputeDetail();default:return farmerHome()}}
function farmerHome(){const s=season(st.season),p=plot(s.plotId),ls=d.logs.filter(x=>x.seasonId===st.season).sort((a,b)=>b.date.localeCompare(a.date)),total=d.costs.filter(x=>x.seasonId===st.season).reduce((a,b)=>a+b.amount,0);return `<div class="content-width">${head('Bảng tin mùa vụ','Hôm nay ruộng lúa thế nào?','Theo dõi công việc đã làm và ghi chép mới, giống dòng thời gian nhưng dành riêng cho canh tác.')}<div class="card card-hero"><div class="row" style="align-items:start"><div class="flex1"><span class="chip">${ic('sprout','sm')} Mùa vụ đang canh tác</span><h2>${esc(s.name)} · ${esc(p.name)}</h2><p>Giống ${esc(s.crop)} · ${num(p.area)} m² · Sản lượng dự kiến ${num(s.yield)} kg</p><div class="button-row">${btn('Xem mùa vụ','season',true,'arrow')}${btn('Ghi nhật ký','journal',false,'plus')}</div></div><div style="width:115px" class="hero-visual" aria-hidden="true"></div></div></div><div class="card"><div class="card-row"><h2>Hôm nay bà con muốn làm gì?</h2><span class="chip neutral">Thao tác nhanh</span></div><div class="quick-actions" style="margin-top:14px"><button class="quick-action" data-action="new-log">${ic('book','lg')}Ghi việc đã làm</button><button class="quick-action" data-action="new-cost">${ic('wallet','lg')}Ghi chi phí</button><button class="quick-action" data-go="plots">${ic('field','lg')}Xem ruộng lúa</button><button class="quick-action" data-go="listing-create">${ic('bag','lg')}Đăng bán lúa</button></div></div><div class="card"><div class="card-row"><h2>Nhật ký canh tác</h2><button class="linkish" data-go="journal">Xem tất cả ${ic('arrow','sm')}</button></div><div class="timeline" style="margin-top:20px">${ls.slice(0,3).map(l=>`<div class="time-item"><strong>${esc(workTypes[l.type]||l.type)}</strong><div class="fine">${today(l.date)} · ${esc(p.name)}</div><p>${esc(l.detail)}</p>${l.amount?`<small>Số lượng: ${num(l.amount)} ${esc(l.unit)}</small>`:''}</div>`).join('')||`<div class="empty"><p>Chưa có nhật ký trong mùa vụ.</p></div>`}</div></div><div class="two"><div class="card"><span class="fine">Đã ghi chi phí</span><div style="font-size:21px;font-weight:800;color:var(--brand-900)">${money(total)}</div>${btn('Chi tiết chi phí','costs',false,'arrow','sm')}</div><div class="card"><span class="fine">Bài đăng đang bán</span><div style="font-size:21px;font-weight:800;color:var(--brand-900)">${d.listings.filter(x=>x.status==='OPEN').length} bài</div>${btn('Xem báo giá','listings',false,'arrow','sm')}</div></div></div>`}
function plotsPage(){return `<div class="content-width">${head('Farming Service','Ruộng lúa của tôi','Mỗi ruộng có thể có nhiều mùa vụ. Chọn ruộng để xem nhật ký, chi phí và báo cáo.')}<div class="card"><div class="card-row"><h2>Danh sách ruộng (${d.plots.filter(x=>x.visible).length})</h2><button class="btn primary" data-action="new-plot">${ic('plus','sm')}Thêm ruộng</button></div></div>${d.plots.filter(p=>p.visible).map(p=>{const curr=seasonsOf(p.id).find(x=>x.status==='IN_PROGRESS')||seasonsOf(p.id)[0];return `<button class="listing-card" data-plot="${p.id}"><div class="row" style="align-items:start"><div class="mini-rice">${ic('field','xl')}</div><div class="flex1"><div class="card-row"><div class="listing-title">${esc(p.name)}</div>${status(curr?.status||'IN_PROGRESS','season')}</div><div class="listing-sub">${ic('pin','sm')} ${esc(p.location)}</div><div class="listing-meta"><span>${ic('field','sm')}${num(p.area)} m²</span><span>${ic('calendar','sm')}${seasonsOf(p.id).length} mùa vụ</span><span>${ic('sprout','sm')}${esc(curr?.crop||'Chưa có mùa vụ')}</span></div></div>${ic('chevron')}</div></button>`}).join('')}<div class="callout info">Một ruộng có thể có nhiều mùa vụ. Khi đăng bán, cần chọn chính xác một ruộng và một mùa vụ; không tự chọn mùa vụ mới nhất thay người dùng.</div></div>`}
function seasonPage(){const p=plot(st.plot),s=season(st.season);const total=d.costs.filter(x=>x.seasonId===s.id).reduce((a,x)=>a+x.amount,0);return `<div class="content-width"><button class="breadcrumb" data-go="plots">${ic('back','sm')} Tất cả ruộng</button>${head('Ruộng & mùa vụ',p.name,`${p.location} · ${num(p.area)} m²`)}<div class="card"><div class="card-row"><h2>Mùa vụ của ruộng</h2><button class="btn sm" data-action="new-season">${ic('plus','sm')}Thêm mùa vụ</button></div><div class="tabs">${seasonsOf(p.id).map(x=>`<button class="${s.id===x.id?'active':''}" data-season="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="card-row"><div><div class="kicker">${esc(s.crop)} · ${today(s.start)}</div><h2 style="margin-top:6px">${esc(s.name)}</h2></div>${status(s.status,'season')}</div><div class="stats" style="margin-top:15px"><div class="stat"><span class="label">Diện tích</span><strong>${num(p.area)} m²</strong></div><div class="stat"><span class="label">Sản lượng dự kiến</span><strong>${num(s.yield)} kg</strong></div><div class="stat"><span class="label">Chi phí đã ghi</span><strong>${money(total)}</strong></div></div>${s.status==='COMPLETED'?`<div class="callout">Sản lượng thực tế: <strong>${num(s.actual)} kg</strong>. Mùa vụ đã hoàn tất vẫn lưu lịch sử.</div>`:`<div class="button-row" style="margin-top:17px"><button class="btn" data-action="complete-season">${ic('check','sm')}Hoàn thành mùa vụ</button>${btn('Đăng bán lúa','listing-create',true,'bag')}</div>`}</div><div class="feature-grid"><button class="feature-link" data-go="journal">${ic('book','lg')}<strong>Nhật ký canh tác</strong><p>Xem và ghi công việc đã thực hiện trong mùa vụ.</p></button><button class="feature-link" data-go="costs">${ic('wallet','lg')}<strong>Chi phí canh tác</strong><p>Theo dõi tiền giống, phân bón và các khoản chi.</p></button><button class="feature-link" data-go="report">${ic('file','lg')}<strong>Báo cáo mùa vụ</strong><p>Xem bản tổng hợp, tham khảo PDF xuất từ Farming.</p></button><button class="feature-link" data-action="plot-visibility">${ic('eye','lg')}<strong>Ẩn ruộng khỏi danh sách</strong><p>Giữ lại dữ liệu lịch sử, không xóa vật lý.</p></button></div></div>`}
function journalPage(){const s=season(st.season),p=plot(s.plotId);const logs=d.logs.filter(x=>x.seasonId===s.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="content-width">${head('Farming · Nhật ký','Nhật ký canh tác',`${p.name} · ${s.name} · ${s.crop}`)}<div class="card"><div class="card-row"><div><h2>Công việc đã ghi</h2><div class="help">Nhật ký được sắp xếp theo ngày thực hiện.</div></div><button class="btn primary" data-action="new-log">${ic('plus','sm')} Ghi công việc</button></div></div><div class="card"><div class="timeline" style="margin-top:8px">${logs.map(l=>`<div class="time-item"><div class="card-row"><strong>${esc(workTypes[l.type]||l.type)}</strong><button class="linkish" data-action="edit-log" data-id="${l.id}">${ic('tune','sm')} Sửa</button></div><small>${today(l.date)}</small><p>${esc(l.detail)}</p>${l.amount!==null?`<span class="chip neutral">${num(l.amount)} ${esc(l.unit||'')}</span>`:''}</div>`).join('')||`<div class="empty"><h3>Chưa có nhật ký</h3><p>Hãy ghi lại công việc đầu tiên của mùa vụ.</p></div>`}</div></div></div>`}
function costsPage(){const s=season(st.season),p=plot(s.plotId),items=d.costs.filter(x=>x.seasonId===s.id).sort((a,b)=>b.date.localeCompare(a.date)),total=items.reduce((a,x)=>a+x.amount,0);return `<div class="content-width">${head('Farming · Chi phí','Chi phí canh tác',`${p.name} · ${s.name}`)}<div class="card card-hero"><div class="kicker">Tổng chi phí đã ghi trong mùa vụ</div><h2 style="font-size:32px">${money(total)}</h2><p>Đây là tổng khoản đã nhập, không tự suy ra lợi nhuận khi chưa có doanh thu phù hợp.</p><button class="btn primary" data-action="new-cost">${ic('plus','sm')}Thêm chi phí</button></div><div class="card"><div class="card-row"><h2>Các khoản chi</h2><span class="chip neutral">${items.length} khoản</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Ngày</th><th>Loại chi</th><th>Chi tiết</th><th>Số tiền</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${today(x.date)}</td><td>${esc(costTypes[x.category]||x.category)}</td><td>${esc(x.detail)}</td><td class="bold nowrap">${money(x.amount)}</td><td><button class="linkish" data-action="edit-cost" data-id="${x.id}">Sửa</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function reportPage(){const s=season(st.season),p=plot(s.plotId),ls=d.logs.filter(x=>x.seasonId===s.id),cs=d.costs.filter(x=>x.seasonId===s.id),total=cs.reduce((a,x)=>a+x.amount,0);return `<div class="content-width">${head('Farming · Báo cáo','Báo cáo mùa vụ',`Tổng hợp từ nhật ký và chi phí của ${p.name} · ${s.name}.`)}<div class="card"><div class="card-row"><h2>Thông tin tổng hợp</h2><button class="btn" data-action="pdf-guide">${ic('download','sm')}Xuất PDF</button></div><div class="stats">${[['Diện tích',num(p.area)+' m²'],['Sản lượng dự kiến',num(s.yield)+' kg'],['Số nhật ký',num(ls.length)],['Số khoản chi',num(cs.length)],['Tổng chi phí',money(total)],['Trạng thái',labels[s.status]]].map(([a,b])=>`<div class="stat"><span class="label">${esc(a)}</span><strong style="font-size:14px">${esc(b)}</strong></div>`).join('')}</div></div><div class="card"><h2>Nhật ký gần đây</h2>${ls.slice(0,4).map(x=>infoRow(today(x.date),esc(workTypes[x.type]||x.type))).join('')}</div><div class="callout info">File PDF thật phải được xuất bởi <strong>GET /api/v1/crop-seasons/{cropSeasonId}/report/pdf</strong>. Prototype không tự tạo PDF rồi giả là báo cáo backend.</div></div>`}
function farmerListings(){return `<div class="content-width">${head('Trading Service','Bài đăng bán lúa','Chọn một bài đăng để xem tất cả báo giá của thương lái và trạng thái trao đổi.')}<div class="card"><div class="card-row"><h2>Bài đăng của tôi</h2>${btn('Đăng bán lúa','listing-create',true,'plus')}</div><p>Thông tin giống lúa, diện tích, sản lượng được lấy từ Farming khi tạo bài.</p></div>${d.listings.map(l=>listingCard(l,false)).join('')}<div class="callout warn">API lấy danh sách Listing của Farmer cần đối chiếu đầy đủ với Contract/API chung khi kết nối thực tế. Giao diện này không phải bằng chứng endpoint đã có.</div></div>`}
function listingCard(l,isTrader){const p=plot(l.plotId),s=season(l.seasonId),pending=offersOf(l.id).filter(x=>x.status==='PENDING').length;return `<button class="listing-card" data-listing="${l.id}"><div class="row" style="align-items:flex-start"><span class="mini-rice">${ic('crop','xl')}</span><div class="flex1"><div class="card-row" style="align-items:start"><div><div class="listing-title">Lúa ${esc(s.crop)} · ${esc(p.name)}</div><div class="listing-sub">${esc(l.place)}</div></div>${status(l.status,'listing')}</div><div class="listing-meta"><span>${ic('field','sm')}${num(p.area)} m²</span><span>${ic('sprout','sm')}${num(s.yield)} kg dự kiến</span><span>${ic('bag','sm')}${isTrader?`${num(l.distance)} km (demo)`:`${pending} báo giá mới`}</span></div><div class="row" style="margin-top:14px;color:var(--brand-700);font-size:11px;font-weight:800">${isTrader?'Xem thông tin nguồn lúa':'Mở bài đăng & xem báo giá'} ${ic('arrow','sm')}</div></div></div></button>`}
function listingDetail(){const l=listing(st.listing),p=plot(l.plotId),s=season(l.seasonId),isTrader=st.role==='trader',of=offersOf(l.id);return `<div class="content-width"><button class="breadcrumb" data-go="${isTrader?'feed':'listings'}">${ic('back','sm')} ${isTrader?'Nguồn lúa gần tôi':'Bài đăng bán lúa'}</button>${head('Trading · Chi tiết bài đăng',`Lúa ${s.crop} · ${p.name}`,`${p.location} · ${s.name}`)}<div class="card"><div class="card-row"><h2>Thông tin lúa</h2>${status(l.status,'listing')}</div><div class="stats"><div class="stat"><span class="label">Giống lúa</span><strong>${esc(s.crop)}</strong></div><div class="stat"><span class="label">Sản lượng dự kiến</span><strong>${num(s.yield)} kg</strong></div><div class="stat"><span class="label">Diện tích</span><strong>${num(p.area)} m²</strong></div></div><p>${isTrader?'Thông tin phù hợp quyền xem từ Trading; số liệu ở đây là dữ liệu minh họa.':'Nguồn dữ liệu được chụp (snapshot) từ Farming tại lúc tạo Listing.'}</p></div>${isTrader?`<div class="card"><div class="card-row"><h2>Trao đổi thu mua</h2><span class="chip neutral">Trader</span></div><p>Gửi báo giá cho người bán. Chỉ khi Farmer chấp nhận Offer thì Chat mới được tạo qua sự kiện OFFER_ACCEPTED.</p>${l.status==='OPEN'?`<button class="btn primary" data-action="new-offer">${ic('plus','sm')}Gửi báo giá</button>`:`<div class="callout warn">Bài này đã khóa giao dịch, không nhận chốt thêm giao dịch mới.</div>`}</div>`:`<div class="section-head"><div><h2>Danh sách báo giá (${of.length})</h2><p>Chỉ Farmer sở hữu bài đăng mới được xem phần này.</p></div></div>${of.map(o=>offerCard(o,l)).join('')}<div class="callout warn">Farmer có thể đồng ý trao đổi với nhiều Offer trên Listing OPEN. Chỉ một giao dịch được chốt khi cọc mô phỏng 5% thành công; không tự từ chối hoặc xóa các Offer còn lại.</div>`}</div>`}
function offerCard(o,l){const t=person(o.traderId),c=conOf(o.id);return `<div class="offer"><div class="card-row"><div class="row">${avatar(t,'gold')}<div><strong style="font-size:13px">${esc(t.name)}</strong><div class="fine">Gửi ${today(o.created)}</div></div></div>${status(o.status,'offer')}</div><div class="two" style="margin:12px 0"><div class="read-only"><small>Mức giá đề nghị · đơn vị cần chốt</small><strong>${money(o.price)}</strong></div><div class="read-only"><small>Mức trừ tối đa đề nghị</small><strong>${num(o.maximumDeduction)}%</strong></div></div><div class="help">“${esc(o.message)}”</div><div class="button-row" style="margin-top:15px">${o.status==='PENDING'&&l.status==='OPEN'?`<button class="btn primary" data-action="accept-offer" data-id="${o.id}">${ic('check','sm')}Đồng ý trao đổi</button><button class="btn" data-action="reject-offer" data-id="${o.id}">Từ chối</button>`:''}${o.status==='ACCEPTED'?(c?`<button class="btn primary" data-open-chat="${c.id}">${ic('chat','sm')}Mở trò chuyện</button>`:`<span class="chip amber">Đang chờ Chat xử lý OFFER_ACCEPTED</span><button class="btn sm" data-action="simulate-chat" data-id="${o.id}">Mô phỏng Kafka nhận event</button>`):''}</div></div>`}
function createListing(){const p=plot(st.plot),s=season(st.season),step=st.listingStep;return `<div class="content-width"><button class="breadcrumb" data-go="listings">${ic('back','sm')} Bài đăng bán lúa</button>${head('Trading · Tạo bài đăng','Đăng bán lúa','Ba bước, chỉ yêu cầu giá mong muốn; các dữ liệu canh tác được lấy từ Farming.')}<div class="stepper"><span class="${step===1?'active':'done'}">1 · Chọn ruộng</span><span class="${step===2?'active':step>2?'done':''}">2 · Xem dữ liệu</span><span class="${step===3?'active':''}">3 · Đăng bán</span></div><div class="card">${step===1?`<h2>Chọn ruộng và mùa vụ</h2><p>Không tự chọn mùa vụ mới nhất. Cần đúng chủ sở hữu và dữ liệu đầy đủ.</p><form id="listing-step-1" class="stack-md">${select('lPlot','Ruộng của tôi',d.plots.filter(x=>x.visible).map(x=>[x.id,x.name]),st.plot)}${select('lSeason','Mùa vụ',seasonsOf(st.plot).map(x=>[x.id,x.name+' · '+x.crop]),st.season)}<button class="btn primary lg" type="submit">Tiếp tục ${ic('arrow','sm')}</button></form>`:step===2?`<h2>Xác nhận dữ liệu từ Farming</h2><div class="two">${readonly('Ruộng',p.name)}${readonly('Mùa vụ',s.name)}${readonly('Giống lúa',s.crop)}${readonly('Sản lượng dự kiến',num(s.yield)+' kg')}${readonly('Diện tích',num(p.area)+' m²')}${readonly('Vị trí',p.location)}</div><div class="callout info">Dữ liệu là snapshot từ Farming. Không sửa trực tiếp giống lúa, sản lượng hoặc GPS trong form Listing.</div><div class="button-row"><button class="btn" data-step="1">Quay lại</button><button class="btn primary" data-step="3">Thông tin đúng · Tiếp tục ${ic('arrow','sm')}</button></div>`:`<h2>Giá mong muốn</h2><p>Contract hiện sử dụng decimal VND cho expectedPrice; cần nhóm xác nhận nghĩa là VND/kg hay tổng tiền trước khi triển khai UI thật.</p><form id="listing-create-form" class="stack-md">${field('expectedPrice','Giá mong muốn (VND, đơn vị kinh tế chưa chốt)','number','8500',true,'min="1" step="0.01"')}<div class="callout warn">Giao diện demo không tính tổng tiền hay đơn vị theo kg khi nghiệp vụ chưa xác nhận.</div><div class="button-row"><button type="button" class="btn" data-step="2">Quay lại</button><button class="btn primary lg" type="submit">${ic('check','sm')} Đăng bán (demo)</button></div></form>`}</div></div>`}
function contractsPage(){return `<div class="content-width">${head('Payment Service','Hợp đồng & tiền cọc','Hợp đồng thuộc Payment. Cọc là mô phỏng 5%, chưa có giao dịch tiền thật.')}<div class="callout warn">Nạp hoặc rút cọc ở prototype không xử lý tiền. Backend thật phải kiểm tra độc quyền Listing, idempotency, trạng thái cọc và tranh chấp.</div>${d.contracts.filter(x=>st.role==='farmer'?x.farmerId==='F1':x.traderId==='T2').map(c=>{const o=offer(c.offerId),l=listing(o.listingId),s=season(l.seasonId);return `<div class="card"><div class="card-row"><div><div class="kicker">${esc(c.id)} · Lúa ${esc(s.crop)}</div><h2 style="margin:5px 0">Hợp đồng giao thương</h2></div>${status(c.status,'contract')}</div>${infoRow('Giá trị hợp đồng',money(c.total))}${infoRow('Cọc mô phỏng 5%',money(c.deposit))}${infoRow('Ngày giao dự kiến',today(c.date))}${infoRow('Trạng thái cọc',c.depositStatus?status(c.depositStatus,'deposit'):'<span class="muted">Chưa tạo cọc</span>')}<div class="button-row" style="margin-top:14px"><button class="btn primary" data-contract="${c.id}">${ic('eye','sm')}Xem hợp đồng</button>${c.disputeId?`<button class="btn" data-dispute="${c.disputeId}">${ic('shield','sm')}Xem tranh chấp</button>`:''}</div></div>`}).join('')||`<div class="empty"><h3>Chưa có hợp đồng</h3><p>Hợp đồng được lập bởi Trader sau khi Offer được Farmer chấp nhận.</p>${btn('Mở tin nhắn','messages',true,'chat')}</div>`}</div>`}
function disputesPage(){return `<div class="content-width">${head('Payment · Dispute','Tranh chấp hợp đồng','Xem hồ sơ và tình trạng giữ cọc mô phỏng. Admin mới có quyền xử lý theo quy trình.')}<div class="card"><h2>Hồ sơ liên quan</h2><p>Đây là màn hình tham chiếu; dữ liệu, bằng chứng và quyền xử lý thực tế do Payment sở hữu.</p></div>${d.disputes.slice(0,2).map(x=>`<button class="listing-card" data-dispute="${x.id}"><div class="card-row"><div class="listing-title">${esc(x.reason)}</div>${status(x.status,'dispute')}</div><div class="listing-sub">${esc(x.id)} · ${today(x.submitted)} · ${esc(x.contractId)}</div><div class="listing-meta"><span>${ic('lock','sm')} ${x.hold?'Đang giữ cọc để xử lý':'Không giữ cọc'}</span></div><div class="row" style="margin-top:10px;color:var(--brand-700);font-weight:800;font-size:11px">Mở hồ sơ ${ic('arrow','sm')}</div></button>`).join('')}</div>`}
function disputeDetail(){const x=d.disputes.find(x=>x.id===st.dispute)||d.disputes[0];return `<div class="content-width"><button class="breadcrumb" data-go="disputes">${ic('back','sm')} Tranh chấp</button>${head('Payment · Hồ sơ tranh chấp',x.reason,`${x.id} · Hợp đồng ${x.contractId}`)}<div class="card"><div class="card-row"><h2>Trạng thái hồ sơ</h2>${status(x.status,'dispute')}</div>${infoRow('Ngày gửi',today(x.submitted))}${infoRow('Người yêu cầu',esc(x.applicant))}${infoRow('Cọc mô phỏng',x.hold?'<span class="status amber">Đang giữ để xử lý</span>':'Không giữ cọc')}<div class="callout">${esc(x.detail)}</div><div class="button-row"><button class="btn" data-action="evidence-note">${ic('image','sm')}Xem nguyên tắc bằng chứng</button>${st.role==='admin'?`<button class="btn primary" data-action="decision-note">${ic('shield','sm')}Quy trình quyết định</button>`:''}</div></div></div>`}

function traderViews(){switch(st.page){case 'home':return traderHome();case 'feed':return traderFeed();case 'listing-detail':return listingDetail();case 'contracts':return contractsPage();case 'disputes':return disputesPage();case 'dispute-detail':return disputeDetail();default:return traderHome()}}
function traderHome(){return `<div class="content-width">${head('Không gian thương lái','Tìm nguồn lúa, giao thương dễ dàng','Các nguồn lúa được xem theo phạm vi GPS; thương lượng bằng Offer và phòng Chat khi Farmer đồng ý.')}<div class="card card-hero"><div class="role-cover"><div><div class="kicker">Khám phá nguồn lúa</div><h2>Lúa tốt gần khu vực thu mua</h2><p>Xem thông tin nguồn hàng và liên hệ nông dân bằng cách gửi báo giá hợp lệ.</p>${btn('Tìm nguồn lúa gần tôi','feed',true,'compass')}</div><div class="hero-visual"></div></div></div><div class="three">${[['Nguồn lúa demo',d.listings.filter(x=>x.status==='OPEN').length+' bài','compass'],['Cuộc trao đổi',d.conversations.filter(x=>x.traderId==='T2').length+' phòng','chat'],['Hợp đồng liên quan',d.contracts.filter(x=>x.traderId==='T2').length+' hợp đồng','file']].map(([a,b,i])=>`<div class="stat">${ic(i,'sm')}<span class="label">${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('')}</div><div class="section-head"><h2>Nguồn lúa gần đây</h2><button class="linkish" data-go="feed">Xem thêm ${ic('arrow','sm')}</button></div>${d.listings.filter(x=>x.status==='OPEN').slice(0,2).map(x=>listingCard(x,true)).join('')}<div class="callout info">Trang tổng quan này tổng hợp thông tin demo. Khi tích hợp chỉ dùng endpoint đã được quyền; không suy ra một API dashboard mới.</div></div>`}
function traderFeed(){const list=d.listings.filter(x=>x.distance<=st.feedRadius);return `<div class="content-width">${head('Trading · GPS Market Feed','Nguồn lúa gần tôi','Chọn phạm vi tìm, xem các bài đăng phù hợp rồi gửi báo giá.')}<div class="card"><div class="card-row"><h2>Khu vực tìm kiếm</h2><span class="chip blue">${ic('pin','sm')} GPS minh họa</span></div><div class="form-grid" style="margin-top:14px"><div class="field"><label for="radius">Bán kính tìm (km)</label><select id="radius"><option value="5" ${st.feedRadius===5?'selected':''}>5 km</option><option value="15" ${st.feedRadius===15?'selected':''}>15 km</option><option value="30" ${st.feedRadius===30?'selected':''}>30 km</option></select></div><div class="field"><label>Vị trí hiện tại</label><div class="read-only"><strong>An Giang · vị trí mẫu</strong><small>Không xin vị trí thật trong prototype</small></div></div></div><div class="help" style="margin-top:12px">Frontend thật gọi GET /api/v1/listings/feed với lat, lng, radius, page, size. Không bổ sung lọc giống hoặc điểm uy tín ngoài Contract.</div></div><div class="section-head"><h2>${list.length} nguồn lúa trong phạm vi mẫu</h2><span class="chip neutral">Bán kính ${st.feedRadius} km</span></div>${list.map(x=>listingCard(x,true)).join('')||`<div class="empty"><h3>Không có nguồn lúa trong phạm vi</h3><p>Thử tăng bán kính tìm kiếm, không tự thay vị trí của người dùng.</p></div>`}<div class="callout warn">Giá, diện tích và chi tiết nguồn hàng trong demo là dữ liệu ghép để minh họa UI. Khi code phải đối chiếu trường thực sự được Trading Feed cho phép trả về và các API đọc Listing đã duyệt.</div></div>`}
/* ---------------------------- ADMIN ---------------------------- */
function adminViews(){switch(st.page){case 'home':return adminHome();case 'accounts':return adminAccounts();case 'account-detail':return accountDetail();case 'disputes':return adminDisputes();case 'dispute-detail':return disputeDetail();default:return adminHome()}}
function adminHome(){return `<div class="content-width">${head('Admin Workspace','Bảng điều khiển quản trị','Chỉ hiển thị nghiệp vụ tài khoản và tranh chấp thuộc quyền Admin.')}<div class="three"><div class="stat"><span class="label">Tài khoản (demo)</span><strong>${d.accounts.length}</strong></div><div class="stat"><span class="label">Hồ sơ cần xử lý</span><strong>${d.disputes.filter(x=>x.status!=='RESOLVED').length}</strong></div><div class="stat"><span class="label">Thông báo của tôi</span><strong>${d.notifications.filter(x=>!x.read).length}</strong></div></div><div class="section-head"><h2>Công việc chính</h2></div><div class="feature-grid"><button class="feature-link" data-go="accounts">${ic('users','lg')}<strong>Quản lý tài khoản</strong><p>Xem vai trò, trạng thái và chi tiết theo quyền được duyệt.</p></button><button class="feature-link" data-go="disputes">${ic('shield','lg')}<strong>Xử lý tranh chấp</strong><p>Tiếp nhận, kiểm tra bằng chứng và quyết định theo Payment.</p></button></div><div class="section-head"><h2>Hồ sơ cần chú ý</h2><button class="linkish" data-go="disputes">Xem tất cả ${ic('arrow','sm')}</button></div>${d.disputes.filter(x=>x.status!=='RESOLVED').map(x=>`<button class="listing-card" data-dispute="${x.id}"><div class="card-row"><strong>${esc(x.id)} · ${esc(x.contractId)}</strong>${status(x.status,'dispute')}</div><div class="listing-sub">${esc(x.reason)}</div></button>`).join('')}<div class="callout info">Các bộ đếm chỉ minh họa bằng dữ liệu mẫu. Đây không phải API quản trị tổng hợp và không chứng minh admin được quyền xem dữ liệu của service khác.</div></div>`}
function adminAccounts(){return `<div class="content-width">${head('User · Admin','Quản lý tài khoản','Lọc theo role và trạng thái, mở từng tài khoản để xem theo quyền Admin.')}<div class="card"><div class="form-grid">${select('role-filter','Vai trò',[['','Tất cả'],['FARMER','Nông dân'],['TRADER','Thương lái'],['ADMIN','Quản trị']])}${select('state-filter','Trạng thái',[['','Tất cả'],['ACTIVE','Đang hoạt động'],['LOCKED','Đã khóa'],['UNVERIFIED','Chưa xác minh'],['INACTIVE','Không hoạt động']])}</div><p class="help">Các bộ lọc đang chạy trên dữ liệu mẫu. Backend User hỗ trợ lọc role/status.</p></div><div class="card"><div class="table-wrap"><table class="data-table" id="accounts-table"><thead><tr><th>Người dùng</th><th>Vai trò</th><th>Trạng thái</th><th>Tham gia</th><th></th></tr></thead><tbody>${d.accounts.map(a=>`<tr data-role="${a.role}" data-status="${a.status}"><td><strong>${esc(a.name)}</strong><div class="fine">${esc(a.id)}</div></td><td>${a.role}</td><td>${status(a.status,'account')}</td><td>${esc(a.joined)}</td><td><button class="btn sm" data-account="${a.id}">Chi tiết</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function accountDetail(){const a=d.accounts.find(x=>x.id===st.account)||d.accounts[0];return `<div class="content-width"><button class="breadcrumb" data-go="accounts">${ic('back','sm')} Danh sách tài khoản</button>${head('User · Account','Chi tiết tài khoản',`Mã tham chiếu mẫu ${a.id}`)}<div class="card"><div class="row">${avatar({initial:a.name.charAt(0)})}<div><h2 style="margin:0">${esc(a.name)}</h2><div class="fine">${esc(a.email)}</div></div></div><hr class="divider"/>${infoRow('Vai trò',esc(a.role))}${infoRow('Trạng thái',status(a.status,'account'))}${infoRow('Tham gia',esc(a.joined))}<div class="callout warn">Chỉ thay đổi các field và trạng thái User Service cho phép. Không đổi role/email/password. Không mở khóa tài khoản khi điểm uy tín còn 0 hoặc có nguyên nhân khóa khác.</div><div class="button-row"><button class="btn" data-action="admin-account-note">${ic('tune','sm')}Quy tắc sửa hồ sơ</button><button class="btn danger" data-action="admin-lock-note">${ic('lock','sm')}Quy trình khóa/mở</button></div></div></div>`}
function adminDisputes(){return `<div class="content-width">${head('Payment · Admin','Quản lý tranh chấp','Danh sách hồ sơ mở hoặc đang xem xét, xử lý theo quyền và phiên bản quyết định.')}<div class="card"><div class="card-row"><h2>Hồ sơ tranh chấp</h2><span class="chip amber">Demo · Không thực thi quyết định</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Mã hồ sơ</th><th>Hợp đồng</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${d.disputes.map(x=>`<tr><td><strong>${esc(x.id)}</strong><div class="fine">${today(x.submitted)}</div></td><td>${esc(x.contractId)}</td><td>${esc(x.reason)}</td><td>${status(x.status,'dispute')}</td><td><button class="btn sm" data-dispute="${x.id}">Xem hồ sơ</button></td></tr>`).join('')}</tbody></table></div></div><div class="callout info">Quyết định, hoàn điểm hoặc xử lý cọc phải qua Payment/User API và idempotency/version đã chốt. Giao diện không tự xử lý nghiệp vụ.</div></div>`}
/* -------------------------- COMMON -------------------------- */
function notifications(){return `<div class="content-width">${head('Notification Service','Thông báo của tôi','Mỗi người chỉ được xem thông báo thuộc tài khoản của mình.')}<div class="card"><div class="card-row"><h2>Thông báo gần đây</h2><span class="chip neutral">${d.notifications.filter(x=>!x.read).length} chưa đọc (mẫu)</span></div><p>Chỉ đánh dấu đọc từng thông báo. Không có tính năng “Đánh dấu tất cả” trong MVP.</p></div>${d.notifications.map(n=>`<button class="notif-row ${n.read?'':'unread'}" data-notification="${n.id}"><span class="avatar blue">${ic(n.type==='MESSAGE_CREATED'?'chat':n.type==='OFFER_CREATED'?'bag':'file','sm')}</span><div class="flex1"><div class="card-row"><h3>${esc(n.title)}</h3><small class="fine">${esc(n.time)}</small></div><p>${esc(n.text)}</p></div>${n.read?'':'<span class="tag-dot"></span>'}</button>`).join('')}</div>`}
function profile(){const role=st.role;return `<div class="content-width">${head('User Service','Hồ sơ của tôi','Thông tin mẫu trong phiên prototype; không lưu tài khoản thật.')}<div class="card"><div class="row">${avatar({initial:role==='farmer'?'A':role==='trader'?'H':'Q'},'gold')}<div><h2 style="margin:0">${role==='farmer'?'Nguyễn Văn An':role==='trader'?'Thương lái Hòa':'Quản trị viên'}</h2><div class="fine">${ROLE_LABEL[role]}</div></div></div><hr class="divider"/>${infoRow('Vai trò',esc(role.toUpperCase()))}${infoRow('Trạng thái',status('ACTIVE','account'))}${infoRow('Mã tài khoản','UUID thật do User Service sở hữu')}<div class="callout info">Public profile của Contract không bao gồm email, số điện thoại chi tiết, địa chỉ riêng hay điểm uy tín. Màn hình này chỉ dùng dữ liệu mẫu.</div><div class="button-row"><button class="btn" data-action="profile-note">${ic('tune','sm')}Quy định cập nhật hồ sơ</button>${btn('Mở UI chuẩn nhóm','guide',false,'layers')}</div></div></div>`}
function guide(){return `<div class="content-width style-guide">${head('Handoff · Dành cho cả team','Bộ giao diện chuẩn V3','Một hệ design tokens, cấu trúc trang và component dùng chung. Giữ nguyên Contract v2.1 khi triển khai frontend.')}<div class="tabs"><button data-guide-tab="tokens" class="${st.guideTab==='tokens'?'active':''}">Màu & chữ</button><button data-guide-tab="components" class="${st.guideTab==='components'?'active':''}">Component</button><button data-guide-tab="routes" class="${st.guideTab==='routes'?'active':''}">Sitemap</button><button data-guide-tab="rules" class="${st.guideTab==='rules'?'active':''}">Quy tắc BA</button></div>${st.guideTab==='tokens'?`<div class="card"><h2>Màu nhận diện</h2><div class="token-colors">${[['#164735','Xanh đậm','Brand 900'],['#246B45','Xanh hành động','Brand 700'],['#D8AD47','Vàng lúa','Gold 500'],['#F3F6F1','Nền ứng dụng','Surface'],['#182820','Chữ chính','Ink']].map(([c,a,b])=>`<div class="token-item"><div class="token-swatch" style="background:${c}"></div><strong>${a}</strong><small>${c}<br>${b}</small></div>`).join('')}</div><hr class="divider"/><h2>Typography & kích thước</h2><p style="font-size:21px;font-weight:800;color:var(--brand-900)">Mùa vụ Đông Xuân – Ghi chép dễ dàng</p><p>Font <strong>Be Vietnam Pro</strong>, kiểm tra dấu: Đắk Lắk, ruộng, giống, Nguyễn, quyền.</p><div class="two">${readonly('Farmer mobile','Body khoảng 18px; nút chính ≥52px')}${readonly('Desktop','Body 14–16px theo chức năng; không dưới 14px cho bảng thật')}${readonly('Bo góc card','18px')}${readonly('Nhịp cách lề','4 / 8 / 12 / 16 / 24 / 32 px')}</div></div>`:st.guideTab==='components'?`<div class="card"><h2>Thư viện component tham chiếu</h2><div class="button-row"><button class="btn primary">${ic('plus','sm')} Nút chính</button><button class="btn">Nút phụ</button><button class="btn danger">Tác vụ nhạy cảm</button><button class="btn" disabled>Đang vô hiệu</button></div><hr class="divider"/><div class="row wrap">${['OPEN','ACCEPTED','LOCKED','SOLD','PENDING_DEPOSIT','UNDER_REVIEW','RESOLVED','ACTIVE'].map(status).join('')}</div><hr class="divider"/><div class="form-grid">${field('guide-name','Nhãn ở ngoài trường','text','Tên ruộng',false)}${select('guide-select','Danh sách lựa chọn',[['1','Mùa vụ Đông Xuân'],['2','Mùa vụ Thu Đông']])}</div><div class="callout info">Mỗi nút phải có trạng thái bình thường, hover, focus, loading/disabled và phản hồi lỗi. Không dùng chỉ màu để diễn đạt trạng thái.</div></div>`:st.guideTab==='routes'?`<div class="card"><h2>Điều hướng đã chuẩn hóa</h2><div class="three">${Object.entries(navs).map(([role,arr])=>`<div><strong>${ROLE_LABEL[role]}</strong><ul class="guide-list">${arr.map(x=>`<li>${esc(x[1])}</li>`).join('')}</ul></div>`).join('')}</div><hr class="divider"/><p class="help">Desktop có thanh điều hướng trên cùng, sidebar trái, nội dung giữa và thông tin ngữ cảnh bên phải. Chat thay bằng danh sách phòng · hội thoại · thông tin Offer. Mobile có thanh điều hướng dưới.</p></div>`:`<div class="card"><h2>Quy tắc không được tự thay đổi</h2><ul class="guide-list"><li>Farmer tạo Listing từ Plot + Crop Season; thông tin lúa/GPS qua Farming snapshot.</li><li>Farmer có thể ACCEPTED nhiều Offer để mở nhiều Chat theo offerId, chưa chốt bán.</li><li>Chỉ Payment + Trading phối hợp cọc mô phỏng thành công mới LOCKED một Listing; SOLD chỉ khi Contract COMPLETED.</li><li>Chat chỉ được tạo từ OFFER_ACCEPTED, không tạo bằng nhắn tin tự do.</li><li>Trader không xem danh sách Offer của Trader khác; Admin không mặc nhiên xem Chat.</li><li>Contract và Deposit là module trong Payment, không có Contract Service riêng; không thanh toán tiền lúa thật.</li><li>Không công khai điểm uy tín, không tạo huy hiệu Trader đã xác minh.</li><li>Đơn vị giá expectedPrice/price cần xác nhận; API danh sách/chi tiết chưa rõ không tự chế endpoint.</li></ul></div>`}<div class="card"><div class="card-row"><h2>Quy trình để code giống nhau</h2><span class="chip blue">Dành cho frontend</span></div><div class="feature-grid"><div class="feature-link"><strong>1. Dùng chung styles.css</strong><p>Import token CSS, không sao chép màu riêng từng màn hình.</p></div><div class="feature-link"><strong>2. Dùng đúng tên role/state</strong><p>Biểu diễn nhãn tiếng Việt ở UI, không thay enum API.</p></div><div class="feature-link"><strong>3. Tách UI & nghiệp vụ</strong><p>Giao diện chỉ gọi service owner qua Gateway.</p></div><div class="feature-link"><strong>4. Review dựa vào prototype</strong><p>So sánh layout, component, quyền và edge state.</p></div></div></div></div>`}
/* ---------------------------- CHAT ---------------------------- */
function chatList(){return d.conversations.filter(c=>st.role==='farmer'?c.farmerId==='F1':c.traderId==='T2')}
function interlocutor(c){return person(st.role==='farmer'?c.traderId:c.farmerId)}
function chatLeft(){const items=chatList().filter(c=>{const p=interlocutor(c),q=st.searchChat.trim().toLocaleLowerCase('vi');const un=st.role==='farmer'?c.unreadFarmer:c.unreadTrader;return (!st.unreadOnly||un>0)&&(!q||(p.name+' '+offer(c.offerId)?.id).toLocaleLowerCase('vi').includes(q))});return `<div class="chat-head"><div class="card-row"><h2>Tin nhắn</h2><span class="chip neutral">${chatList().length} phòng</span></div><label class="fine" for="chat-search">Tìm trong các cuộc trao đổi</label><input class="search-input" id="chat-search" placeholder="Tên người hoặc mã Offer" value="${esc(st.searchChat)}"/></div><div class="chat-list"><div style="padding:5px 7px 12px"><button class="btn sm ${st.unreadOnly?'primary':''}" data-action="unread-filter">${ic('filter','sm')}Chưa đọc</button></div>${items.map(c=>{const p=interlocutor(c),un=st.role==='farmer'?c.unreadFarmer:c.unreadTrader;return `<button class="chat-item ${st.chat===c.id?'active':''}" data-chat="${c.id}">${avatar(p,'sm')}<div class="flex1" style="min-width:0"><div class="card-row"><span class="name">${esc(p.name)}</span><span class="time">${esc(c.when)}</span></div><div class="prev">${esc(c.last)}</div><div class="fine">Offer ${esc(c.offerId)} · ${esc(season(listing(offer(c.offerId).listingId).seasonId).crop)}</div></div>${un?`<span class="unread">${un}</span>`:''}</button>`}).join('')||`<div class="empty" style="margin:10px"><h3>Không tìm thấy phòng</h3><p>Chỉ những Offer đã ACCEPTED mới có Chat.</p></div>`}</div>`}
function chatCenter(){const c=chatList().find(x=>x.id===st.chat)||chatList()[0];if(!c)return `<div class="empty"><h3>Chưa có cuộc trao đổi</h3></div>`;st.chat=c.id;const p=interlocutor(c),isFarmer=st.role==='farmer';return `<div class="chat-top"><button class="btn sm mobile-chat-back" data-action="chat-back" aria-label="Trở về danh sách">${ic('back','sm')}</button>${avatar(p,'sm')}<div class="flex1"><strong>${esc(p.name)}</strong><small style="display:block">Trao đổi riêng theo Offer ${esc(c.offerId)} · ${esc(c.status)}</small></div><button class="btn sm" data-action="chat-details">${ic('info','sm')}<span class="nowrap">Chi tiết</span></button></div><div class="thread" id="thread">${c.messages.map(m=>{const mine=m.sender===(isFarmer?'F1':'T2');return `<div class="bubble-row ${mine?'me':''}">${!mine?avatar(p,'sm'):''}<div><div class="bubble">${esc(m.body)}</div><small>${esc(m.time)}</small></div></div>`}).join('')}${contractOf(c.offerId)?`<div class="callout info" style="margin-top:10px"><div class="row">${ic('file','sm')}<strong>Hợp đồng liên quan · ${esc(contractOf(c.offerId).id)}</strong></div><div style="margin-top:6px">${status(contractOf(c.offerId).status,'contract')}</div><button class="btn sm" style="margin-top:9px" data-contract="${contractOf(c.offerId).id}">${ic('eye','sm')}Xem hợp đồng</button></div>`:''}</div><form class="chat-compose" id="send-message"><input type="text" maxlength="2000" required name="message" aria-label="Nhập tin nhắn" placeholder="Nhập tin nhắn... (demo)"/><button type="submit" class="btn primary" aria-label="Gửi tin nhắn">${ic('send','sm')}Gửi</button></form>`}
function chatRight(){const c=chatList().find(x=>x.id===st.chat)||chatList()[0];if(!c)return '';const p=interlocutor(c),o=offer(c.offerId),l=listing(o.listingId),s=season(l.seasonId),co=contractOf(o.id);return `<div style="text-align:center;padding:11px 0">${avatar(p)}<h3 style="margin:10px 0 2px">${esc(p.name)}</h3><div class="help">Cuộc trao đổi theo Offer ${esc(o.id)}</div></div><hr class="divider"/><h3>Thông tin nguồn lúa</h3>${infoRow('Bài đăng',`Lúa ${esc(s.crop)}`)}${infoRow('Mã Offer',esc(o.id))}${infoRow('Báo giá · đơn vị cần chốt',money(o.price))}${infoRow('Trạng thái Offer',status(o.status,'offer'))}${infoRow('Hợp đồng',co?status(co.status,'contract'):'<span class="muted">Chưa có</span>')}<div class="stack" style="margin-top:14px"><button class="btn block" data-listing="${l.id}">${ic('eye','sm')}Xem bài đăng</button>${co?`<button class="btn block" data-contract="${co.id}">${ic('file','sm')}Xem hợp đồng</button>`:st.role==='trader'?`<button class="btn primary block" data-action="contract-create-note">${ic('file','sm')}Lập hợp đồng</button>`:''}</div><div class="callout warn" style="margin-top:20px">Chat chỉ dành cho hai participant của Offer đã chấp nhận. Không gộp phòng theo cặp người dùng và không tự chốt bán lúa.</div>`}
/* ------------------------- USER EVENTS ------------------------- */
function btnAction(action,id){switch(action){
 case 'new-plot':return modal('Thêm ruộng lúa',`<form class="stack-md" id="plot-form">${field('name','Tên ruộng','text','',true,'maxlength="100"')}${field('location','Địa điểm','text','',true)}${field('area','Diện tích (m²)','number','',true,'min="0.01" step="0.01"')}<div class="two">${field('lat','Vĩ độ GPS','number','10.123',true,'min="-90" max="90" step="any"')}${field('lng','Kinh độ GPS','number','105.456',true,'min="-180" max="180" step="any"')}</div><div class="modal-actions"><button class="btn" type="button" data-close="1">Hủy</button><button class="btn primary" type="submit">Tạo ruộng (demo)</button></div></form><p class="help">FarmerId lấy từ xác thực backend, không nhận giá trị tự khai trong API thật.</p>`);
 case 'new-season':return modal('Thêm mùa vụ',`<form class="stack-md" id="season-form">${field('seasonName','Tên mùa vụ','text','Đông Xuân 2026–2027',true)}${field('cropType','Giống lúa','text','ST25',true)}${field('startDate','Ngày bắt đầu','date','2026-11-01',true)}${field('expectedYield','Sản lượng dự kiến (kg)','number','1400',true,'min="0" step="0.01"')}<div class="modal-actions"><button type="button" class="btn" data-close="1">Hủy</button><button class="btn primary" type="submit">Thêm mùa vụ (demo)</button></div></form>`);
 case 'new-log':return logForm(null);
 case 'edit-log':return logForm(d.logs.find(x=>x.id===id));
 case 'new-cost':return costForm(null);
 case 'edit-cost':return costForm(d.costs.find(x=>x.id===id));
 case 'complete-season':return modal('Hoàn thành mùa vụ',`<p>Mùa vụ <strong>${esc(season(st.season).name)}</strong> sẽ chuyển sang COMPLETED. Hãy nhập sản lượng thực tế bằng kg.</p><form id="complete-season-form" class="stack-md">${field('actualYield','Sản lượng thu hoạch thực tế (kg)','number',season(st.season).yield,true,'min="0" step="0.01"')}<div class="modal-actions"><button class="btn" type="button" data-close="1">Hủy</button><button class="btn primary" type="submit">Xác nhận demo</button></div></form>`);
 case 'plot-visibility':return modal('Ẩn ruộng',`<div class="callout warn">Ẩn ruộng chỉ dùng cơ chế visibility/soft delete, không xóa dữ liệu lịch sử. Một Plot ẩn không được dùng tạo Listing snapshot mới.</div><div class="help">Bản demo không ẩn Ruộng A1 vì nó đang là mẫu liên kết trong nhiều màn hình. Khi code, PATCH /api/v1/plots/{plotId}/visibility phải theo ownership và trạng thái.</div>`,`<button class="btn" data-close="1">Đóng</button>`);
 case 'pdf-guide':return demoNote('Tính năng PDF của Farming: GET /api/v1/crop-seasons/{cropSeasonId}/report/pdf. Khi kết nối frontend, tải response application/pdf có Bearer hợp lệ.');

/* Deep-links phục vụ duyệt mẫu mobile trong trình duyệt; không thay thế router hay auth. */
function demoRouteFromHash(){
 const part=decodeURIComponent(location.hash.slice(1));
 const match=/^(farmer|trader|admin)\/(home|plots|season|journal|costs|report|listings|listing-detail|listing-create|messages|contracts|disputes|dispute-detail|feed|accounts|account-detail|notifications|profile|guide)(?:\/([a-zA-Z0-9-]+))?$/.exec(part);
 if(!match)return false;
 const [all,role,page,id]=match;
 const common=['home','notifications','profile','guide'];
 const allowed={farmer:['plots','season','journal','costs','report','listings','listing-detail','listing-create','messages','contracts','disputes','dispute-detail'],trader:['feed','listing-detail','messages','contracts','disputes','dispute-detail'],admin:['accounts','account-detail','disputes','dispute-detail']};
 if(!common.includes(page)&&!(allowed[role]||[]).includes(page))return false;
 st.role=role;st.page=page;st.chatOpen=false;
 if(page==='listing-detail'&&id&&d.listings.some(x=>x.id===id))st.listing=id;
 if(page==='messages'&&id&&d.conversations.some(x=>x.id===id)){st.chat=id;st.chatOpen=true}
 if(page==='season'&&id&&d.seasons.some(x=>x.id===id)){st.season=id;st.plot=season(id).plotId}
 if(page==='account-detail'&&id&&d.accounts.some(x=>x.id===id))st.account=id;
 if(page==='dispute-detail'&&id&&d.disputes.some(x=>x.id===id))st.dispute=id;
 return true;
}
window.addEventListener('hashchange',()=>{if(demoRouteFromHash())render()});
demoRouteFromHash();

    const isMineTab=st.role==='farmer'&&st.marketTab==='mine';
    return `<div class="market-toolbar"><div class="market-toolbar-main"><div class="market-toolbar-title"><span class="kicker">GIAO THƯƠNG LÚA NƯỚC</span><h1>${isTrader?'Tìm nguồn lúa':'Thị trường lúa'}</h1><p>${isTrader?'Xem ảnh và thông tin nguồn lúa gần khu vực thu mua.':'Xem bài mình đăng hoặc tham khảo nguồn lúa trong bản thiết kế thử nghiệm.'}</p></div><div class="market-actions">${isTrader?'':`<button class="btn primary" data-go="listing-create">${ic('plus','sm')}<span>Tạo bài đăng</span></button>`}<button class="btn ${st.filterOpen?'selected-filter':''}" data-v5-filter="1" aria-expanded="${st.filterOpen}" aria-controls="market-filter">${ic('filter','sm')}<span>Lọc</span>${ic('chevron','sm')}</button></div></div>
    ${st.role==='farmer'?`<div class="market-tabs" role="tablist" aria-label="Góc nhìn thị trường"><button role="tab" aria-selected="${isMineTab}" data-v5-tab="mine" class="${isMineTab?'active':''}">${ic('bag','sm')}Bài đăng của tôi <small>${d.listings.filter(x=>x.ownerId==='F1').length}</small></button><button role="tab" aria-selected="${!isMineTab}" data-v5-tab="market" class="${!isMineTab?'active':''}">${ic('compass','sm')}Tham khảo thị trường</button></div>`:''}
    ${st.filterOpen?`<div class="market-filter-shade" data-v5-filter="1" aria-hidden="true"></div><div class="market-filter-panel" id="market-filter"><div class="filter-panel-top"><h2>Bộ lọc</h2><button class="icon-text" data-v5-filter="1" aria-label="Đóng bộ lọc">${ic('x','sm')}Đóng</button></div>${isTrader||!isMineTab?`<div class="filter-scope"><label for="v5-radius">Bán kính tìm kiếm (mẫu)</label><select id="v5-radius"><option value="5" ${st.feedRadius===5?'selected':''}>5 km</option><option value="15" ${st.feedRadius===15?'selected':''}>15 km</option><option value="30" ${st.feedRadius===30?'selected':''}>30 km</option><option value="50" ${st.feedRadius===50?'selected':''}>50 km</option></select></div><p class="fine">${isTrader?'Trading Feed hiện chỉ có lat, lng, radius, page, size.':'Farmer Market Feed và bộ lọc chỉ là đề xuất cần phê duyệt API/quyền.'}</p>`:`<p class="fine">Chỉ hiển thị các bài thuộc tài khoản Farmer. Chưa tự thêm các bộ lọc server ngoài Contract.</p>`}<div class="button-row"><button class="btn sm" data-v5-filter-reset="1">Đặt lại</button><button class="btn primary sm" data-v5-filter="1">Xem kết quả</button></div></div>`:''}</div>`;
  }

  listingCard=function(l,isTrader=false){
    const s=liteSummary(l),pending=isMine(l)?offersOf(l.id).filter(x=>x.status==='PENDING').length:0;
    const media=s.photo;const action=isMine(l)?`Mở bài và xem ${offersOf(l.id).length} báo giá`:st.role==='trader'?'Xem nguồn lúa · Gửi báo giá':'Xem bài để tham khảo';
    return `<article class="feed-card">
      <div class="feed-card-header"><span class="feed-avatar">${ic('sprout','lg')}</span><div class="feed-author"><strong>Lúa ${esc(s.crop)} · ${esc(s.plotName)}</strong><span>${ic('pin','sm')} ${esc(s.place)} · ${esc(s.season)}</span><span class="feed-seller">Người đăng: ${esc(s.seller)}</span></div>${status(l.status,'listing')}</div>
      <p class="feed-caption">${esc(captionOf(l))}</p>
      <button class="feed-image-link" data-listing="${esc(l.id)}" aria-label="Xem chi tiết nguồn lúa ${esc(s.crop)}"><img class="feed-photo" src="${esc(media)}" alt="Ảnh minh họa ruộng lúa ${esc(s.crop)}" loading="lazy"/><span class="photo-watermark">Ảnh minh họa</span></button>
      <div class="feed-facts"><div><span>Diện tích</span><strong>${num(s.area)} m²</strong></div><div><span>Sản lượng dự kiến</span><strong>${num(s.yield)} kg</strong></div><div><span>${isTrader?'Khoảng cách (demo)':isMine(l)?'Báo giá mới':'Trạng thái'}</span><strong>${isTrader?num(l.distance)+' km':isMine(l)?pending+' báo giá':(l.status==='OPEN'?'Đang đăng bán':'Đã chốt')}</strong></div></div>
      <div class="feed-card-bottom"><span class="price-note">${ic('info','sm')} Giá: VND, đơn vị kinh tế chờ xác nhận</span><button class="btn ${isMine(l)?'primary':''}" data-listing="${esc(l.id)}">${ic('eye','sm')}${action}</button></div>
    </article>`;
  };

  farmerListings=function(){
    const own=st.marketTab!=='market';let list=own?d.listings.filter(l=>l.ownerId==='F1'):[...d.listings];
    if(!own)list=list.filter(l=>l.distance<=st.feedRadius);
    return `<div class="content-width market-content">${marketToolbar(false)}${!own?`<div class="callout info market-warning">Đây là <strong>bản đề xuất trải nghiệm</strong>. Farmer xem Listing của người khác chưa nằm trong quyền GET Feed của BA–SOA v2.1; không được xem Offer và không gửi Offer. Cần nhóm duyệt trước khi nối API.</div>`:''}<div class="feed-count"><h2>${own?'Bài đăng của tôi':'Bài đăng tham khảo'} <span>${list.length}</span></h2><span class="chip neutral">${!own&&st.feedRadius?'Phạm vi '+st.feedRadius+' km · Demo': 'Dữ liệu mẫu'}</span></div>${list.map(l=>listingCard(l,false)).join('')||`<div class="empty"><h3>Chưa có bài đăng trong mục này</h3><p>${own?'Có thể tạo bài từ ruộng và mùa vụ hợp lệ.':'Hãy thay đổi bán kính hoặc quay lại sau.'}</p></div>`}${demoBanner}</div>`;
  };
  traderFeed=function(){const list=d.listings.filter(l=>l.status==='OPEN'&&l.distance<=st.feedRadius);return `<div class="content-width market-content">${marketToolbar(true)}<div class="feed-count"><h2>Nguồn lúa trong phạm vi <span>${list.length}</span></h2><span class="chip neutral">${st.feedRadius} km · Vị trí mẫu An Giang</span></div>${list.map(l=>listingCard(l,true)).join('')||`<div class="empty"><h3>Chưa có nguồn lúa phù hợp</h3><p>Hãy chọn bán kính lớn hơn trong bộ lọc.</p></div>`}<div class="contract-note">API thật: <code>GET /api/v1/listings/feed</code> với <code>lat, lng, radius, page, size</code>. Các trường hình ảnh/chú thích chỉ là đề xuất UI, chưa thuộc response đã chốt.</div></div>`};

  listingDetail=function(){const l=listing(st.listing);if(!l)return `<div class="empty">Không tìm thấy bài đăng.</div>`;

    <div class="feed-facts four-facts"><div><span>Giống lúa</span><strong>${esc(s.crop)}</strong></div><div><span>Diện tích</span><strong>${num(s.area)} m²</strong></div><div><span>Dự kiến</span><strong>${num(s.yield)} kg</strong></div><div><span>Trạng thái</span><strong>${esc(labels[l.status]||l.status)}</strong></div></div><div class="price-note price-note-detail">Giá trong demo: ${money(l.expectedPrice)} · đơn vị VND/kg hay tổng tiền <strong>chưa chốt BA</strong></div></div>
    ${owner?`<div class="offer-panel"><div class="offer-panel-heading"><div><span class="kicker">Dành riêng cho chủ bài</span><h2>Danh sách báo giá <span class="offer-n">${of.length}</span></h2><p>Chỉ tài khoản Farmer sở hữu bài đăng được xem Offer và đồng ý trao đổi.</p></div></div>${of.map(o=>offerCard(o,l)).join('')||`<div class="empty"><h3>Chưa có báo giá nào</h3><p>Khi Trader gửi Offer, thông báo sẽ thuộc tài khoản của bà con.</p></div>`}<div class="callout warn">Chấp nhận nhiều báo giá chỉ mở trao đổi. Một Listing chỉ được chốt một giao dịch sau cọc mô phỏng thành công.</div></div>`:trader?`<div class="offer-panel"><h2>Quan tâm đến nguồn lúa này?</h2><p>Gửi báo giá cho Farmer. Chỉ khi Farmer chấp nhận mới có cuộc trò chuyện riêng theo Offer.</p>${l.status==='OPEN'?`<button class="btn primary" data-action="new-offer">${ic('plus','sm')}Gửi báo giá</button>`:'<div class="callout warn">Bài đã chốt giao dịch, không gửi báo giá mới.</div>'}</div>`:`<div class="offer-panel"><h2>Đang xem để tham khảo</h2><p>Farmer chỉ được xem thông tin mô phỏng công khai; không hiển thị báo giá của người khác và không có quyền gửi Offer.</p><div class="callout info">Đề xuất quyền đọc cho Farmer cần nhóm phê duyệt thay đổi Contract trước khi triển khai API.</div></div>`}
    ${demoBanner}</div>`;
  };

  createListing=function(){const p=myPlot(),s=mySeason(),step=st.listingStep;return `<div class="content-width"><button class="breadcrumb" data-go="listings">${ic('back','sm')} Bài đăng bán lúa</button>${head('Trading · Farmer','Tạo bài đăng bán lúa','Chọn đúng ruộng và mùa vụ, kiểm tra dữ liệu rồi xem trước trước khi đăng.')}<div class="stepper"><span class="${step===1?'active':'done'}">1 · Chọn ruộng</span><span class="${step===2?'active':step>2?'done':''}">2 · Thông tin</span><span class="${step===3?'active':''}">3 · Xem trước</span></div><div class="card">${step===1?`<h2>Chọn ruộng và mùa vụ</h2><p>Không tự chọn một mùa vụ không thuộc ruộng.</p><form id="listing-step-1" class="stack-md">${select('lPlot','Ruộng của tôi',d.plots.filter(x=>x.visible).map(x=>[x.id,x.name]),st.plot)}<div id="listing-season-container">${select('lSeason','Mùa vụ',seasonsOf(st.plot).map(x=>[x.id,x.name+' · '+x.crop]),st.season)}</div>${seasonsOf(st.plot).length?'':'<div class="callout warn">Ruộng này chưa có mùa vụ. Cần tạo mùa vụ trước khi đăng bán.</div>'}<button class="btn primary lg" type="submit">Tiếp tục ${ic('arrow','sm')}</button></form>`:step===2?`<h2>Kiểm tra dữ liệu canh tác</h2>${p&&s?`<div class="two">${readonly('Ruộng',p.name)}${readonly('Mùa vụ',s.name)}${readonly('Giống lúa',s.crop)}${readonly('Dự kiến',num(s.yield)+' kg')}${readonly('Diện tích',num(p.area)+' m²')}${readonly('Địa điểm',p.location)}</div><p class="help">Đây là snapshot lấy từ Farming. Không sửa GPS/giống lúa trực tiếp ở bước đăng bán.</p><div class="button-row"><button class="btn" data-step="1">Quay lại</button><button class="btn primary" data-step="3">Xác nhận và tiếp tục</button></div>`:'<div class="callout warn">Chưa có mùa vụ hợp lệ. Quay lại bước chọn ruộng.</div><button class="btn" data-step="1">Quay lại</button>'}`:`<h2>Thông tin và xem trước bài đăng</h2><p>Ảnh và chú thích là phần <strong>giao diện demo đề xuất</strong>; API tạo Listing v2.1 hiện chưa nhận các trường này.</p><form id="listing-create-form" class="stack-md">${field('expectedPrice','Giá mong muốn (VND — đơn vị kinh tế chưa chốt)','number','8500',true,'min="1" step="0.01"')}<div class="demo-proposal"><label for="v5-photo-input">Ảnh ruộng lúa (demo trong trình duyệt)</label><input type="file" id="v5-photo-input" accept="image/png,image/jpeg,image/webp"/><p class="help">Ảnh chọn tại máy chỉ hiện trong bản xem thử, không tải lên máy chủ. Không thay thế Listing/Media Contract.</p><label for="v5-caption-input">Chú thích bài đăng (demo)</label><textarea id="v5-caption-input" name="demoCaption" rows="3" maxlength="400" placeholder="Ví dụ: Lúa đang phát triển tốt, dự kiến thu hoạch vào cuối mùa vụ.">${esc(st.captionDraft||'')}</textarea></div><div class="listing-mini-preview"><img id="v5-create-preview-img" src="${esc(st.photoDraft||(p?.id==='P2'?referencePhoto.L2:referencePhoto.L1))}" alt="Ảnh minh họa xem trước bài đăng"/><div><strong>${esc(s?.crop||'Lúa')} · ${esc(p?.name||'Ruộng')}</strong><p id="v5-create-preview-caption">${esc(st.captionDraft||'Bài đăng sẽ hiển thị ảnh, chú thích và dữ liệu ruộng đã chọn.')}</p></div></div><div class="callout warn">Chưa chốt đơn vị giá; các ảnh, chú thích, quyền xem feed của Farmer cần duyệt riêng trước khi code backend.</div><div class="button-row"><button type="button" class="btn" data-step="2">Quay lại</button><button class="btn primary lg" type="submit">${ic('check','sm')}Đăng bản mẫu</button></div></form>`}</div></div>`};

  notifications=function(){const notes=ownNotifs(),unread=notes.filter(n=>!n.read).length;return `<div class="content-width">${head('Notification Service','Thông báo của tôi','Dữ liệu minh họa chỉ thuộc tài khoản đang xem.')}<div class="card"><div class="card-row"><h2>Thông báo gần đây</h2><span class="chip neutral">${unread} chưa đọc</span></div><p>Chỉ đánh dấu đọc từng thông báo; không có read-all trong MVP.</p></div>${notes.map(n=>`<button class="notif-row ${n.read?'':'unread'}" data-notification="${n.id}"><span class="avatar blue">${ic(n.type==='MESSAGE_CREATED'?'chat':n.type==='OFFER_CREATED'?'bag':'file','sm')}</span><div class="flex1"><div class="card-row"><h3>${esc(n.title)}</h3><small>${esc(n.time)}</small></div><p>${esc(n.text)}</p></div>${n.read?'':'<span class="tag-dot"></span>'}</button>`).join('')||'<div class="empty">Chưa có thông báo nào.</div>'}</div>`};
  chatLeft=function(){return original.chatLeft().replace('<span class="chip neutral">'+chatList().length+' phòng</span>',`<span class="chip neutral">${chatList().length} cuộc trò chuyện</span>`)};
  chatRight=function(){return original.chatRight().replace('<h3>Thông tin nguồn lúa</h3>', '<h3>Thông tin bài đăng & Offer</h3>')};
  guide=function(){return original.guide().replace('Bộ giao diện chuẩn V3','Bộ giao diện chuẩn V5')+`<div class="content-width"><div class="contract-note"><strong>Đề xuất chưa duyệt:</strong> Farmer đọc Market Feed bên ngoài tài khoản, ảnh/chú thích Listing, endpoint upload ảnh, quyền đọc/sắp xếp/tìm kiếm nâng cao. Không tự triển khai backend từ UI này.</div></div>`};
  adminHome=function(){return original.adminHome().replace(/(Thông báo của tôi<\/span><strong>)\d+/,(_,a)=>a+ownNotifs().filter(x=>!x.read).length)};
  // Chỉ dựng form tham khảo, không thay quyết định Admin/Payment đã chốt.
  const adminForm=(type)=>{const a=d.accounts.find(x=>x.id===st.account)||d.accounts[0];if(type==='account')return modal('Giao diện cập nhật hồ sơ',`<form id="v5-admin-profile" class="stack-md">${field('adminDisplayName','Tên hiển thị (demo)','text',a.name,true)}<div class="read-only"><small>Vai trò · không được thay đổi</small><strong>${esc(a.role)}</strong></div><div class="read-only"><small>Email · không được thay đổi ở đây</small><strong>${esc(a.email)}</strong></div><p class="help">Chỉ các trường được User Service cho phép; bản mẫu không cập nhật tài khoản thật.</p><div class="modal-actions"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit">Lưu tên trong demo</button></div></form>`);return modal('Quy trình khóa / mở tài khoản',`<div class="callout warn">Đây là bố cục kiểm tra trước thao tác quan trọng, <strong>không phải nút khóa thật</strong>. Phải xác minh nguyên nhân khóa, điểm uy tín, quyền Admin và trạng thái email theo User Contract.</div>${infoRow('Tài khoản',esc(a.name))}${infoRow('Trạng thái hiện tại',status(a.status,'account'))}<div class="modal-actions"><button class="btn primary" data-close>Đóng</button></div>`);};

  // Capture xử lý các control V5 trước các listener của V4.
  document.addEventListener('click',function(e){
    const b=e.target.closest('[data-v5-tab],[data-v5-filter],[data-v5-filter-reset]');if(!b)return;
    e.preventDefault();e.stopImmediatePropagation();
    if(b.dataset.v5Tab){st.marketTab=b.dataset.v5Tab;st.filterOpen=false;render();return;}
    if(b.hasAttribute('data-v5-filter-reset')){st.feedRadius=30;render();return;}
    st.filterOpen=!st.filterOpen;render();
  },true);
  document.addEventListener('change',function(e){const t=e.target;if(!t.matches('.v5-plot-select,.v5-season-select,#v5-radius,#v5-photo-input'))return;e.stopImmediatePropagation();
    if(t.matches('.v5-plot-select')){makeCurrent(t.value);render();return;}
    if(t.matches('.v5-season-select')){st.season=t.value;render();return;}
    if(t.id==='v5-radius'){st.feedRadius=Number(t.value);render();return;}
    if(t.id==='v5-photo-input'){const file=t.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('Chỉ chọn ảnh JPG/PNG/WebP tối đa 5MB trong bản demo.');return;}if(st.photoDraft?.startsWith('blob:'))URL.revokeObjectURL(st.photoDraft);st.photoDraft=URL.createObjectURL(file);const img=document.getElementById('v5-create-preview-img');if(img)img.src=st.photoDraft;}
  },true);
  document.addEventListener('input',function(e){if(e.target.id!=='v5-caption-input')return;st.captionDraft=e.target.value;const p=document.getElementById('v5-create-preview-caption');if(p)p.textContent=st.captionDraft||'Bài đăng sẽ hiển thị ảnh và chú thích tại đây.'},true);
  document.addEventListener('submit',function(e){
    if(e.target.id==='v5-admin-profile'){e.preventDefault();e.stopImmediatePropagation();const a=d.accounts.find(x=>x.id===st.account);if(a)a.name=e.target.elements.adminDisplayName.value.trim()||a.name;closeModal();render();toast('Đã cập nhật tên trên dữ liệu demo.');return;}
    if(e.target.id==='plot-form'){
      e.preventDefault();e.stopImmediatePropagation();const v=new FormData(e.target),area=Number(v.get('area')),lat=Number(v.get('lat')),lng=Number(v.get('lng'));
      if(!(area>0)||Math.abs(lat)>90||Math.abs(lng)>180)return toast('Diện tích hoặc GPS chưa hợp lệ.');
      const id='P'+(d.plots.length+1);d.plots.push({id,name:String(v.get('name')).trim(),location:String(v.get('location')).trim(),area,lat,lng,visible:true,seasonIds:[]});st.plot=id;st.season='';closeModal();navTo('plots');toast('Đã tạo ruộng mẫu; hãy tạo mùa vụ đầu tiên.');return;
    }
    if(e.target.id!=='listing-create-form')return;
    e.preventDefault();e.stopImmediatePropagation();
    const form=e.target,v=new FormData(form),p=myPlot(),s=mySeason(),val=Number(v.get('expectedPrice'));
    if(!p||!p.visible||!s||s.plotId!==p.id||!s.crop||!(s.yield>0)||p.lat==null||p.lng==null){toast('Ruộng/mùa vụ chưa đủ dữ liệu Farming để đăng bán.');return;}
    if(d.listings.some(x=>x.plotId===p.id&&x.status==='OPEN')){demoNote('BR-TRD-001: mỗi Plot chỉ có một bài OPEN. Chọn ruộng khác để tránh tạo trùng.');return;}
    if(!(val>0))return toast('Giá mong muốn phải lớn hơn 0.');
    const id='L'+(d.listings.length+30);d.listings.unshift({id,plotId:p.id,seasonId:s.id,ownerId:'F1',status:'OPEN',expectedPrice:val,offerIds:[],place:p.location,distance:4, demoCaption:String(v.get('demoCaption')||''),demoPhoto:st.photoDraft||referencePhoto.L1});
    st.listing=id;st.marketTab='mine';st.listingStep=1;st.photoDraft='';st.captionDraft='';st.filterOpen=false;navTo('listing-detail');toast('Đã tạo bài đăng demo; ảnh/chú thích chưa có API thật.');
  },true);
  document.addEventListener('click',function(e){const b=e.target.closest('[data-action="admin-account-note"],[data-action="admin-lock-note"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();adminForm(b.dataset.action==='admin-account-note'?'account':'status')},true);
  document.addEventListener('click',function(e){const b=e.target.closest('[data-notification]');if(!b)return;const n=d.notifications.find(x=>x.id===b.dataset.notification);if(!n||n.recipientId!==currentId())return e.stopImmediatePropagation();if(n.target==='accounts'&&st.role==='admin'){e.preventDefault();e.stopImmediatePropagation();n.read=true;navTo('accounts');toast('Đã đọc thông báo Admin (demo).');}},true);
  // V4 có check fallback kỳ vọng s.id; chặn action của ruộng chưa có mùa vụ.
  document.addEventListener('click',function(e){const b=e.target.closest('[data-action="new-log"],[data-action="new-cost"],[data-action="complete-season"]');if(!b||st.role!=='farmer'||mySeason())return;e.preventDefault();e.stopImmediatePropagation();toast('Hãy tạo mùa vụ cho ruộng này trước.');navTo('season')},true);
  // Chọn ruộng mới trong bước 1 mà ruộng chưa có season: cập nhật ô mùa vụ trong form ngay.
  document.addEventListener('change',function(e){if(e.target.id!=='lPlot')return;const id=e.target.value;const ss=seasonsOf(id);const holder=document.getElementById('listing-season-container');if(holder)holder.innerHTML=select('lSeason','Mùa vụ',ss.map(s=>[s.id,s.name+' · '+s.crop]),ss[0]?.id||'')+(ss.length?'':'<div class="callout warn">Ruộng này chưa có mùa vụ.</div>');e.stopImmediatePropagation()},true);
  // Bảo vệ giao diện mẫu khi Trader ở trạng thái không được tạo Offer.
  document.addEventListener('submit',function(e){if(e.target.id!=='offer-form')return;if(st.role==='trader'&&listing(st.listing)?.status==='OPEN')return;e.preventDefault();e.stopImmediatePropagation();closeModal();toast('Không có quyền gửi báo giá cho bài này.');},true);
  const oldNavTo=navTo;
  // Render mới một lần sau khi bổ sung các component/chỉ số.
  render();
})();

render();
})();

</script>
</body>
</html>
