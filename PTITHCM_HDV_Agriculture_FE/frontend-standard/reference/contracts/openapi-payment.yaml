        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/payments/deposits:
    get:
      tags:
      - secure-payment-read-controller
      operationId: deposits
      parameters:
      - name: status
