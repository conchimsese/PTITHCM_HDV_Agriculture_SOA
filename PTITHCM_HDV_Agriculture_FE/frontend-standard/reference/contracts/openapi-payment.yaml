        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Dispute'
  /api/v1/payments/admin/disputes/{disputeId}/decisions:
    post:
      tags:
      - secure-payment-admin-decision-controller
      operationId: decide
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Dispute'
  /api/v1/payments/admin/decisions/{decisionId}/reversal:
    post:
      tags:
      - secure-payment-reversal-controller
      operationId: reverse
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DecisionReversal'
  /api/v1/payments/admin/contracts/{contractId}/disputes:
    post:
      tags:
      - secure-payment-admin-filing-controller
      operationId: open_1
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
