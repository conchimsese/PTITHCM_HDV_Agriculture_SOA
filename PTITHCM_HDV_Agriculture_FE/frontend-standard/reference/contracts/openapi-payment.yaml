        totalAmount:
          type: string
        terms:
          type: string
        deliveryDate:
          type: string
          format: date-time
        status:
          type: string
        penaltyRate:
          type: number
        completedConfirmedAt:
          type: string
          format: date-time
        stateVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OpenRequest:
      type: object
      properties:
        reasonCode:
          type: string
        description:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
    OpenView:
      type: object
