components:
  schemas:
    NoteRequest:
      type: object
      properties:
        content:
          type: string
    LearningNote:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    ResponseRequest:
      type: object
      properties:
        statement:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
    DisputeResponse:
      type: object
      properties:
        responseId:
          type: string
        disputeId:
          type: string
        accountId:
          type: string
        statement:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    UploadResult:
      type: object
      properties:
        evidenceId:
          type: string
        downloadUrl:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
    ReleaseResult:
      type: object
      properties:
        paymentTrackingId:
          type: string
        contractId:
          type: string
        depositAmount:
          type: string
        status:
          type: string
        contractStatus:
          type: string
        releasedAt:
          type: string
          format: date-time
        simulated:
          type: boolean
    PayResult:
      type: object
      properties:
        paymentTrackingId:
          type: string
        contractId:
          type: string
        depositAmount:
          type: string
        status:
          type: string
        contractStatus:
          type: string
        simulated:
          type: boolean
    CreateRequest:
      type: object
      properties:
        offerId:
          type: string
        conversationId:
          type: string
        farmerId:
          type: string
        totalAmount:
          type: string
        deliveryDate:
          type: string
        terms:
          type: string
    Contract:
