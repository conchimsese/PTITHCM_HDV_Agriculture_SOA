# Synchronized with tested secure API, money schema string, 2026-10-29.
openapi: 3.1.0
info:
  title: Payment Service API
  description: REST API documentation for Payment, Contract, Deposit & Dispute Settlement
    (PTIT Agriculture SOA)
  contact:
    name: PTIT SOA Team
    email: group7@ptit.edu.vn
  version: 1.0.0
servers:
- url: http://127.0.0.1:18085
  description: Generated server url
security:
- BearerAuth: []
paths:
  /learning/notes:
    post:
      tags:
      - learning-note-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LearningNote'
  /api/v1/payments/disputes/{disputeId}/responses:
    post:
      tags:
      - secure-payment-dispute-controller
      operationId: respond
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DisputeResponse'
  /api/v1/payments/disputes/{disputeId}/evidence:
    get:
      tags:
      - secure-payment-evidence-controller
      operationId: list
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EvidencePage'
    post:
      tags:
      - secure-payment-evidence-controller
      operationId: upload
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      - name: description
        in: query
        required: false
        schema:
          type: string
      - name: sourceAccountId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UploadResult'
  /api/v1/payments/deposits/{contractId}/release:
    post:
      tags:
      - secure-payment-action-controller
      operationId: release
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReleaseResult'
  /api/v1/payments/deposits/{contractId}/pay:
    post:
      tags:
      - secure-payment-action-controller
      operationId: pay
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayResult'
  /api/v1/payments/contracts:
    post:
      tags:
      - secure-payment-contract-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
