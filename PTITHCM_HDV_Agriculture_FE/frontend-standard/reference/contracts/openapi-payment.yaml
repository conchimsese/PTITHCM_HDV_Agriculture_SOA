                $ref: '#/components/schemas/LearningNote'
  /health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/payments/disputes/{disputeId}:
    get:
      tags:
