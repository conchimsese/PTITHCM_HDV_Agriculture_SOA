services:
  farming-service:
    build: .
    container_name: farming-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@farming-db:5432/farming_db
      - USER_SERVICE_URL=http://user-service:8081
      - ACCESS_STATE_TIMEOUT_MS=1000
      - TRADING_SERVICE_KEY=trading-farming-internal-secret-key
    depends_on:
      farming-db:
        condition: service_healthy
    networks:
      - farming-network

  farming-db:
    image: postgres:16-alpine
    container_name: farming-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farming_db
    volumes:
      - farming_db_data:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farming_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farming-network

volumes:
  farming_db_data:
    driver: local

networks:
  farming-network:
    driver: bridge
